<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">Thông tin sách</h2>

        <form id="productForm">
            <input type="hidden" id="productId" value="0">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label">Tên sách</label>
                    <input type="text" class="form-control" id="bookName" placeholder="Eg. Conan">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Giá</label>
                    <input type="number" class="form-control" id="price" placeholder="Eg. 1000">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Mô tả</label>
                <textarea class="form-control" id="description" rows="3" placeholder="Eg. Sách quá hay!"></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <button type="button" id="btnAdd" class="btn btn-success">
                        <i class="bi bi-plus-circle"></i> Thêm Sản Phẩm
                    </button>
                    <button type="button" id="btnUpdate" class="btn btn-warning">
                        <i class="bi bi-pencil-square"></i> Cập nhật
                    </button>
                </div>
                <button type="button" id="btnReset" class="btn btn-info text-white">
                    <i class="bi bi-arrow-counterclockwise"></i> Reset
                </button>
            </div>
        </form>

        <hr class="my-4">

        <h3 class="mb-3">Danh sách</h3>
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên sách</th>
                    <th>Giá</th>
                    <th>Mô tả</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="bookList"></tbody>
        </table>
    </div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
